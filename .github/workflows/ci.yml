# Checks every push and pull request, forks included. Needs no secrets, writes nowhere:
# read-only token, a throwaway Postgres inside the runner, no deploys, no external services.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }}, Postgres ${{ matrix.pg }}, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 20: the oldest supported (package.json engines). 24: the version in .nvmrc.
        node: ["20", "24"]
        # 17: what Supabase runs in production. 16: the oldest supported, on one Node version.
        pg: ["17"]
        include:
          - node: "24"
            pg: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Postgres ${{ matrix.pg }} server binaries (for the throwaway test cluster)
        run: |
          # The PostgreSQL project's apt repository has every supported major version.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-${{ matrix.pg }}
          echo "CLUTCH_PG_BIN=/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/${{ matrix.pg }}/bin/postgres --version
      - run: npm ci
      # Lint, type-check, app tests, database tests on a temporary local cluster, production build.
      # DATABASE_URL and every service key are blanked inside the script.
      - run: npm run verify
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Shared runners are slower than a laptop: double the load test's latency budget (row budgets unchanged).
          CLUTCH_LATENCY_FACTOR: "2"

  # Optional: only runs where the repository owner has added these secrets (never on forks,
  # which don't receive them). Builds against the configured public Supabase project; it
  # reads configuration only and writes nothing anywhere.
  supabase-config:
    name: build with Supabase configuration (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      HAS_SUPABASE: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' }}
    steps:
      - name: Skip without secrets
        if: env.HAS_SUPABASE != 'true'
        run: echo "No Supabase secrets configured; nothing to check."
      - uses: actions/checkout@v4
        if: env.HAS_SUPABASE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.HAS_SUPABASE == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_SUPABASE == 'true'
        run: npm ci
      - if: env.HAS_SUPABASE == 'true'
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Never a database from CI.
          DATABASE_URL: ""
